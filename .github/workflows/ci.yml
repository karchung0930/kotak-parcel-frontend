name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout frontend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: kotak-parcel-frontend
          persist-credentials: false

      # The build asks the backend for its routes (Wayfinder) and writes into
      # its public/build folder, so check it out next to the frontend.
      - name: Checkout backend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: karchung0930/kotak-parcel-backend
          path: kotak-parcel-backend
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: kotak-parcel-frontend/package-lock.json

      - name: Install backend
        working-directory: kotak-parcel-backend
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate

      - name: Install frontend
        working-directory: kotak-parcel-frontend
        run: npm ci

      - name: Build
        working-directory: kotak-parcel-frontend
        run: npm run build

      - name: Lint and format
        working-directory: kotak-parcel-frontend
        run: npm run check

      - name: Types
        working-directory: kotak-parcel-frontend
        run: npm run types:check

      - name: Helper checks
        working-directory: kotak-parcel-frontend
        run: npm run test:js
